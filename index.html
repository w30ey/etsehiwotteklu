<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

background:#efe8dc;
font-family:"Space Mono", monospace;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:40px;

background-image:
radial-gradient(rgba(0,0,0,.03) 1px, transparent 1px);
background-size:4px 4px;

}

.container{

display:grid;
grid-template-columns:1fr 420px 1fr;
gap:70px;
align-items:center;
max-width:1300px;
width:100%;

}

.left{

text-align:right;

}

.small{

letter-spacing:6px;
font-size:13px;
color:#66786d;
margin-bottom:25px;

}

.name{

font-family:"Cormorant Garamond", serif;
font-size:88px;
line-height:.9;
color:#557467;
font-weight:600;

}

.lastname{

font-style:italic;
}

.bio{

margin-top:30px;
font-size:18px;
line-height:1.8;
color:#66786d;

}

.btn{

display:inline-flex;
align-items:center;
gap:15px;

margin-top:40px;

padding:18px 45px;

background:#d8d5ca;

text-decoration:none;

color:#4d6359;

letter-spacing:3px;

transition:.3s;

}

.btn:hover{

background:#557467;
color:white;

}

.image-box{

border:12px solid rgba(255,255,255,.35);
box-shadow:0 15px 35px rgba(0,0,0,.12);

}

.image-box img{

display:block;
width:100%;
height:620px;
object-fit:cover;
filter:brightness(.75);

}

.right{

padding-left:30px;

}

.right h3{

letter-spacing:6px;
font-size:14px;
margin-bottom:35px;
color:#66786d;

}

.right a{

display:block;
font-family:"Cormorant Garamond", serif;
font-size:28px;
margin:28px 0;
text-decoration:none;
color:rgb(168, 93, 93);
text-shadow:0 0 2px rgba(0,0,0,.25);
transition:.3s;

}

.right a:hover{

transform:translateX(10px);
color:#557467;

}

.footer{

position:fixed;
bottom:20px;
left:20px;
right:20px;
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:12px 24px;
font-size:12px;

}

.footer a{

display:inline-flex;
align-items:center;
gap:8px;
color:#4d6359;
text-decoration:none;
transition:color .3s;

}

.footer a:hover{

color:#a85d5d;

}

.footer a:focus-visible{

outline:2px solid #557467;
outline-offset:4px;

}

.footer svg{

width:18px;
height:18px;
flex:none;

}

@media(max-width:1000px){

.container{

grid-template-columns:1fr;
text-align:center;

}

.left{

text-align:center;

}

.right{

padding:0;

}

.image-box img{

height:500px;

}

}

</style>
